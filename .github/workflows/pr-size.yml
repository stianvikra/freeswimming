name: PR Size

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

jobs:
  size-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR size
        uses: actions/github-script@v7
        with:
          script: |
            const limit = 4000;
            const pr = context.payload.pull_request;
            const additions = pr.additions ?? 0;
            const deletions = pr.deletions ?? 0;
            const changed = additions + deletions;

            await core.summary
              .addHeading("PR Size Check")
              .addRaw(`Limit: **${limit}** changed lines (additions + deletions)\n\n`)
              .addRaw(`This PR: **${changed}** changed lines (${additions} additions, ${deletions} deletions)\n`)
              .write();

            if (changed > limit) {
              core.setFailed(
                `PR is too large (${changed} > ${limit} changed lines). Split the work into smaller PRs.`
              );
            }
