name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    # Keep enough room for dependency install, browser install, app startup, and
    # both smoke suites. Browser install happens once here; the site-lock-smoke
    # job below remains as a required-check gate that depends on this job.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Resolve verification lane
        id: verification-plan
        run: |
          node ./scripts/ci-verification-plan.mjs --summary --event "${{ github.event_name }}" --base "${{ github.base_ref || 'main' }}"
          echo "lane=$(node ./scripts/ci-verification-plan.mjs --lane --event "${{ github.event_name }}" --base "${{ github.base_ref || 'main' }}")" >> "$GITHUB_OUTPUT"

      - name: Skip docs-only smoke suite
        if: steps.verification-plan.outputs.lane == 'docs-only'
        run: echo "[e2e-smoke] Docs-only PR detected; skipping runtime smoke suite."

      - name: Install dependencies
        if: steps.verification-plan.outputs.lane != 'docs-only'
        run: npm ci

      - name: Install Playwright browsers (chromium only)
        if: steps.verification-plan.outputs.lane != 'docs-only'
        run: |
          set -euo pipefail
          timeout 8m npx playwright install chromium || {
            status=$?
            echo "[playwright-install] First install attempt exited ${status}; retrying once."
            timeout 8m npx playwright install chromium
          }

      - name: Run E2E smoke suite
        if: steps.verification-plan.outputs.lane != 'docs-only'
        env:
          SITE_LOCK_ENABLED: "0"
          NEXT_PUBLIC_SUPABASE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
        run: npm run test:e2e:smoke

      - name: Run site-lock smoke suite
        if: steps.verification-plan.outputs.lane != 'docs-only'
        env:
          SITE_LOCK_ENABLED: "1"
          SITE_LOCK_MODE: password
          SITE_LOCK_PASSWORD_HASH: sha256:dbb0e329da7714d323329ff55bf91dcd8206fdc0142e814d8a35724d5a6b7058
          SITE_LOCK_BYPASS_TOKEN: ci-site-lock-bypass-token
          PW_SITE_LOCK_PASSWORD: ci-preview-access
          NEXT_PUBLIC_SUPABASE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
        run: npm run test:e2e:site-lock

      - name: Upload smoke artifacts
        if: always() && steps.verification-plan.outputs.lane != 'docs-only'
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-smoke-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  site-lock-smoke:
    needs: e2e-smoke
    if: always()
    runs-on: ubuntu-latest
    # Required-check sentinel: the actual site-lock smoke suite runs in
    # e2e-smoke after the shared Chromium install, avoiding a second install
    # job that has repeatedly hung before tests start.
    timeout-minutes: 5
    steps:
      - name: Confirm bundled site-lock smoke suite passed
        run: |
          set -euo pipefail
          if [ "${{ needs.e2e-smoke.result }}" != "success" ]; then
            echo "[site-lock-smoke] e2e-smoke did not pass; bundled site-lock smoke suite is not green."
            exit 1
          fi
          echo "[site-lock-smoke] Bundled site-lock smoke suite passed in e2e-smoke."

  verify:
    needs:
      - e2e-smoke
      - site-lock-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Resolve verification lane
        id: verification-plan
        run: |
          node ./scripts/ci-verification-plan.mjs --summary --event "${{ github.event_name }}" --base "${{ github.base_ref || 'main' }}"
          echo "lane=$(node ./scripts/ci-verification-plan.mjs --lane --event "${{ github.event_name }}" --base "${{ github.base_ref || 'main' }}")" >> "$GITHUB_OUTPUT"

      - name: Validate PR body required sections
        if: github.event_name == 'pull_request'
        run: node ./scripts/lint-pr-body-sections.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.verification-plan.outputs.lane != 'docs-only'
        # Verify runs Chromium, WebKit, and Firefox across the full public
        # matrix. GitHub's hosted Ubuntu image does not reliably include the
        # shared system libraries those browsers need, so keep `--with-deps`
        # here and give the job enough time budget to complete both install and
        # the actual verify/build gates.
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Run docs-only verification suite
        if: steps.verification-plan.outputs.lane == 'docs-only'
        run: npm run verify:docs-only

      - name: Run verification suite
        if: steps.verification-plan.outputs.lane != 'docs-only'
        env:
          SITE_LOCK_ENABLED: "0"
          PERF_BUDGET_OUTPUT: artifacts/perf-budget-report.json
          NEXT_PUBLIC_SUPABASE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
        run: npm run verify:public

      - name: Skip webpack production build check for docs-only PRs
        if: steps.verification-plan.outputs.lane == 'docs-only'
        run: echo "[verify] Docs-only PR detected; skipping webpack production build check."

      - name: Run webpack production build check
        if: steps.verification-plan.outputs.lane != 'docs-only'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
        run: npm run build:webpack

      - name: Upload verify artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-verify-artifacts
          path: |
            artifacts/perf-budget-report.json
            artifacts/test-runs
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
