name: Nightly E2E

on:
  schedule:
    # 01:30 Norway time (CET, UTC+1) during winter months.
    - cron: "30 0 * 11,12,1,2 *"
    # 01:30 Norway time (CEST, UTC+2) during summer months.
    # Note: around DST changeover days, runtime can be off by one hour.
    - cron: "30 23 * 3,4,5,6,7,8,9,10 *"
  workflow_dispatch:

concurrency:
  group: nightly-e2e-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  performance-budget-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
        run: npm run build

      - name: Run performance budget gates
        env:
          SITE_LOCK_ENABLED: "0"
          PERF_BUDGET_OUTPUT: artifacts/perf-budget-report.json
          NEXT_PUBLIC_SUPABASE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
        run: npm run test:perf:budgets

      - name: Upload performance budget artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-performance-budget-artifacts
          path: |
            artifacts/perf-budget-report.json
          if-no-files-found: ignore
          retention-days: 14

  e2e-full-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Run full E2E matrix
        env:
          SITE_LOCK_ENABLED: "0"
          NEXT_PUBLIC_SUPABASE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  private-gate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run private-gate regression
        env:
          SITE_LOCK_ENABLED: "1"
          SITE_LOCK_MODE: password
          SITE_LOCK_PASSWORD_HASH: sha256:dbb0e329da7714d323329ff55bf91dcd8206fdc0142e814d8a35724d5a6b7058
          SITE_LOCK_BYPASS_TOKEN: ci-site-lock-bypass-token
          PW_SITE_LOCK_PASSWORD: ci-preview-access
          NEXT_PUBLIC_SUPABASE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
        run: npm run test:e2e:private-gate

      - name: Upload private-gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-private-gate-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
