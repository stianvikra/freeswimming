<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Poolside drill visual placeholder</title>
  <desc id="desc">Dummy visual with lane lines and focus markers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#94a3b8" stroke-opacity="0.12" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <g opacity="0.9">
    <rect x="140" y="180" width="1320" height="640" rx="42" fill="#f8fafc" stroke="#60a5fa" stroke-width="6"/>
    <line x1="220" y1="290" x2="1380" y2="290" stroke="#93c5fd" stroke-width="12" stroke-linecap="round"/>
    <line x1="220" y1="500" x2="1380" y2="500" stroke="#93c5fd" stroke-width="12" stroke-linecap="round"/>
    <line x1="220" y1="710" x2="1380" y2="710" stroke="#93c5fd" stroke-width="12" stroke-linecap="round"/>

    <circle cx="520" cy="500" r="84" fill="#0ea5e9" fill-opacity="0.2" stroke="#0284c7" stroke-width="6"/>
    <circle cx="850" cy="500" r="92" fill="#22c55e" fill-opacity="0.2" stroke="#16a34a" stroke-width="6"/>
    <circle cx="1160" cy="500" r="74" fill="#f97316" fill-opacity="0.2" stroke="#ea580c" stroke-width="6"/>

    <path d="M460 380l95 68M790 380l115 82M1110 380l108 78" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
    <path d="M545 451l-20-10 5 24M905 469l-24-8 7 24M1217 459l-22-10 6 22" fill="#0f172a"/>
  </g>

  <g transform="translate(170 850)">
    <rect width="1260" height="96" rx="20" fill="#0f172a" fill-opacity="0.08"/>
    <text x="40" y="58" font-size="44" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#0f172a">Dummy drill visual - replace with final coach artwork</text>
  </g>
